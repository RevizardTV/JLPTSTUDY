name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python & Whisper Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Bun Dependencies
        run: bun install

      - name: Type Check (Svelte & TS)
        run: bun x svelte-check --tsconfig ./tsconfig.json

      - name: Start Services and Run Tests
        env:
          HF_TOKEN: '${{ secrets.HF_TOKEN }}'
        run: |
          # 1. Start Python FastAPI backend from the python folder using uvicorn
          source venv/bin/activate
          cd python
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          cd ..

          # 2. Poll FastAPI server until ready on port 8000
          echo "Waiting for Python FastAPI server on port 8000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "FastAPI backend is ready!"
              break
            fi
            sleep 1
          done

          # 3. Build and start SvelteKit preview server in the background
          bun run build
          bun run preview -- --port 5173 &

          # 4. Poll SvelteKit server until ready on port 5173
          echo "Waiting for SvelteKit server on port 5173..."
          for i in {1..15}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "SvelteKit server is ready!"
              break
            fi
            sleep 1
          done

          # 5. Run the test suite while both servers are active
          bun test
